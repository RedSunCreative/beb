<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LBV Crew Checklist</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:Georgia,'Times New Roman',serif;color:#222;font-size:11pt;line-height:1.65;background:#fff;}
    .page{max-width:7.5in;margin:0 auto;padding:0.7in;}
    .lbv-logo{font-family:Arial,sans-serif;font-size:24pt;font-weight:900;letter-spacing:-0.5px;margin-bottom:20px;line-height:1;}
    .logo-l{color:#555;} .logo-b{color:#E07818;} .logo-v{color:#2E7D32;}
    .doc-title{font-family:Arial,sans-serif;font-size:18pt;font-weight:900;color:#2563EB;letter-spacing:-0.3px;border-bottom:3px solid #2563EB;padding-bottom:10px;margin-bottom:20px;line-height:1.3;}
    h2{font-family:Arial,sans-serif;font-size:13pt;font-weight:700;color:#2563EB;margin:22px 0 10px;text-transform:uppercase;letter-spacing:0.5px;}
    ul{padding-left:1.2in;}
    li{margin-bottom:5px;}
    p{margin-bottom:12px;}
    hr{border:none;border-top:1px solid #ddd;margin:22px 0;}
    .cb{display:inline-block;width:13px;height:13px;border:1.5px solid #666;border-radius:2px;vertical-align:middle;margin-right:8px;flex-shrink:0;margin-top:1px;}
    .ci{display:flex;align-items:flex-start;margin-bottom:7px;}
    .ci-text{flex:1;}
    .muted{color:#888;font-size:10pt;}
    .print-btn{display:block;margin:0 auto 24px;background:#2563EB;color:#fff;border:none;border-radius:6px;padding:10px 28px;font-family:Arial,sans-serif;font-size:11pt;font-weight:700;cursor:pointer;letter-spacing:0.5px;}
    .print-btn:hover{background:#1d4ed8;}
    .footer-line{font-family:Arial,sans-serif;font-size:9pt;color:#999;border-top:1px solid #eee;margin-top:40px;padding-top:10px;text-align:center;}
    @media print{.print-btn{display:none;}}
  </style>
</head>
<body>
<div class="page" id="content">
  <p style="text-align:center;color:#888;padding:60px 0;">Loading checklist...</p>
</div>
<script>
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt12(t){if(!t)return'—';const[hS,mS]=t.split(':');let h=parseInt(hS,10);const m=parseInt(mS||'0',10);const ap=h>=12?'PM':'AM';h=h%12||12;return`${h}:${String(m).padStart(2,'0')} ${ap} CT`;}
function shiftTime(t,d){const[h,m]=(t||'19:00').split(':').map(Number);const tot=h*60+m+d;const nh=Math.floor(((tot%1440)+1440)%1440/60);const nm=((tot%60)+60)%60;return`${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`;}
function fmtDate(ds){if(!ds)return'—';const[y,mo,d]=ds.split('-').map(Number);const M=['January','February','March','April','May','June','July','August','September','October','November','December'];const sfx=[1,21,31].includes(d)?'st':[2,22].includes(d)?'nd':[3,23].includes(d)?'rd':'th';return`${M[mo-1]} ${d}${sfx}, ${y}`;}

(function(){
  const raw = new URLSearchParams(location.search).get('d');
  if(!raw){document.getElementById('content').innerHTML='<p style="color:red;padding:60px 0;text-align:center;">No checklist data found in URL.</p>';return;}
  let data;
  try{data=JSON.parse(decodeURIComponent(raw));}
  catch(e){document.getElementById('content').innerHTML='<p style="color:red;padding:60px 0;text-align:center;">Could not load checklist data.</p>';return;}

  const{epNum,epTitle,epDate,epTime,name,role,callTime,crew=[]}=data;
  const goLive=epTime||'19:00';
  const callDisplay=callTime||fmt12(shiftTime(goLive,-120));
  const dateStr=fmtDate(epDate);

  document.title=`LBV ${role||'Crew'} Checklist — E${epNum}`;

  const crewRows=crew.length
    ?`<h2>Crew Roster</h2><ul>${crew.map(c=>`<li><b>${esc(c.role||'Crew')}:</b> ${esc(c.name||'')}</li>`).join('')}</ul>`
    :'';

  document.getElementById('content').innerHTML=`
    <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
    <div class="lbv-logo"><span class="logo-l">little.</span> <span class="logo-b">big.</span> <span class="logo-v">voices.</span></div>
    <div class="doc-title">${esc((role||'Crew').toUpperCase())} CHECKLIST — E${esc(epNum)}<br>
    <span style="font-size:12pt;font-weight:400;color:#555;">${esc(name)}</span></div>

    <h2>Show Details</h2>
    <ul>
      <li><b>Episode:</b> ${esc(epNum)}${epTitle?' — '+esc(epTitle):''}</li>
      <li><b>Date:</b> ${dateStr}</li>
      <li><b>Location:</b> Little Big Studio — 1507 Kinney Ave #109, Austin TX<br>
        <span class="muted">(Second building past the entrance off Kinney. Purple light on the ground floor.)</span></li>
      <li><b>Your Call Time:</b> <b>${esc(callDisplay)}</b></li>
      <li><b>Show Circle:</b> ${fmt12(shiftTime(goLive,-20))} — we gather before going live</li>
      <li><b>Go Live:</b> ${fmt12(goLive)}</li>
    </ul>

    <h2>Your Role: ${esc(role||'Crew Member')}</h2>
    <p>Thank you for being part of the crew for Little Big Voices LIVE! You're an essential part of what makes this show possible. Mark relies on you — arrive at your call time ready to go.</p>

    ${crewRows}

    <h2>Checklist</h2>
    <div class="ci"><div class="cb"></div><div class="ci-text">Confirm receipt of this checklist</div></div>
    <div class="ci"><div class="cb"></div><div class="ci-text">Arrive by your call time: <b>${esc(callDisplay)}</b></div></div>
    <div class="ci"><div class="cb"></div><div class="ci-text">Check in with Mark on arrival</div></div>
    <div class="ci"><div class="cb"></div><div class="ci-text">Know where your station / position is before guests arrive</div></div>
    <div class="ci"><div class="cb"></div><div class="ci-text">Coordinate with crew members whose work intersects with yours</div></div>
    <div class="ci"><div class="cb"></div><div class="ci-text">Be at your position for Show Circle: <b>${fmt12(shiftTime(goLive,-20))}</b></div></div>
    <div class="ci"><div class="cb"></div><div class="ci-text">Stay focused, calm, and present — this is a live show</div></div>
    <div class="ci"><div class="cb"></div><div class="ci-text">After the show: check in with Mark before leaving</div></div>

    <hr>
    <p><b>Questions before show day?</b> Contact Mark or reply to the email that sent you this link.</p>
    <div class="footer-line">LBV LIVE! ${esc(role||'Crew')} Checklist &mdash; Episode ${esc(epNum)}</div>`;
})();
</script>
</body>
</html>
